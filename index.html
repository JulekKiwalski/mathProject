<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Matika matika lalala</title>
<style>
  * { box-sizing: border-box; }
  body {
    background: #ffffff;
    color: #222;
    font-family: system-ui, -apple-system, sans-serif;
    margin: 0;
    padding: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  h1 { font-size: 1.25rem; margin: 4px 0 14px; font-weight: 600; }

  .controls {
    display: flex;
    gap: 20px;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }
  .controls label { font-size: 1.05rem; display: flex; align-items: center; gap: 6px; }
  #target {
    width: 80px;
    font-size: 1.25rem;
    padding: 6px;
    border: 2px solid #ccc;
    border-radius: 8px;
    text-align: center;
  }
  .opbox { font-size: 1.5rem; font-weight: 700; }
  input[type=checkbox] { width: 24px; height: 24px; accent-color: #1565c0; }

  .frame {
    display: grid;
    grid-template-columns: 52px repeat(3, 66px) 52px;
    grid-template-rows: 52px repeat(3, 66px) 52px;
    gap: 5px;
    margin-bottom: 16px;
  }
  .cell {
    border: 2px solid #444;
    border-radius: 8px;
    background: #fff;
  }
  .arrow {
    font-size: 1.5rem;
    border: 2px solid #ddd;
    border-radius: 10px;
    background: #fafafa;
    color: #999;
    cursor: pointer;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }
  .arrow.on {
    background: #1565c0;
    border-color: #1565c0;
    color: #fff;
  }

  .buttons { display: flex; gap: 14px; margin-bottom: 18px; }
  .buttons button {
    font-size: 1.1rem;
    padding: 10px 26px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  #removeBtn { background: #eeeeee; color: #333; }
  #solveBtn  { background: #1565c0; color: #fff; font-weight: 600; }

  #status { font-size: 1.05rem; margin-bottom: 12px; min-height: 1.3em; text-align: center; }

  #results {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    justify-content: center;
    max-width: 900px;
  }
  .sol {
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 8px;
    background: #fff;
  }
  .sol table { border-collapse: collapse; margin: 0 auto; }
  .sol td {
    border: 1px solid #555;
    width: 34px;
    height: 34px;
    text-align: center;
    font-size: 1.1rem;
    font-weight: 600;
  }
  .add  { background: #ffe3e3; color: #c62828; }
  .sub  { background: #e3edff; color: #1565c0; }
  #legend { font-size: 0.9rem; margin-bottom: 12px; }
  #legend span { padding: 2px 8px; border-radius: 6px; margin: 0 4px; }
  .sol details { margin-top: 6px; font-size: 0.8rem; color: #555; }
  .sol summary { cursor: pointer; }
</style>
</head>
<body>

<h1>takova krasna hra</h1>

<div class="controls">
  <label>target <input type="number" id="target" value="13"></label>
  <label class="opbox"><input type="checkbox" id="opPlus" checked> +</label>
  <label class="opbox"><input type="checkbox" id="opMinus"> &minus;</label>
</div>

<div class="frame" id="frame">
  <button class="arrow" data-dir="dr" style="grid-area:1/1">&#8600;</button>
  <button class="arrow" data-dir="down" style="grid-area:1/3">&#8595;</button>
  <button class="arrow" data-dir="dl" style="grid-area:1/5">&#8601;</button>
  <button class="arrow" data-dir="right" style="grid-area:3/1">&#8594;</button>
  <button class="arrow" data-dir="left" style="grid-area:3/5">&#8592;</button>
  <button class="arrow" data-dir="ur" style="grid-area:5/1">&#8599;</button>
  <button class="arrow" data-dir="up" style="grid-area:5/3">&#8593;</button>
  <button class="arrow" data-dir="ul" style="grid-area:5/5">&#8598;</button>
</div>

<div class="buttons">
  <button id="removeBtn">remove</button>
  <button id="solveBtn">solve</button>
</div>

<div id="status"></div>
<div id="legend"></div>
<div id="results"></div>

<script>
// Cell indices:  0 1 2
//                3 4 5
//                6 7 8
// Each direction lists the lines it constrains, cells in reading order
// (order matters for subtraction).
const DIRS = {
  right: [[0,1,2],[3,4,5],[6,7,8]],
  left:  [[2,1,0],[5,4,3],[8,7,6]],
  down:  [[0,3,6],[1,4,7],[2,5,8]],
  up:    [[6,3,0],[7,4,1],[8,5,2]],
  dr:    [[0,4,8]],   // top-left -> bottom-right
  ul:    [[8,4,0]],
  dl:    [[2,4,6]],   // top-right -> bottom-left
  ur:    [[6,4,2]]
};

const active = new Set();

// Build the 3x3 board cells in the center of the frame.
const frame = document.getElementById('frame');
for (let r = 0; r < 3; r++) {
  for (let c = 0; c < 3; c++) {
    const d = document.createElement('div');
    d.className = 'cell';
    d.style.gridArea = (r + 2) + '/' + (c + 2);
    frame.appendChild(d);
  }
}

document.querySelectorAll('.arrow').forEach(btn => {
  btn.addEventListener('click', () => {
    const dir = btn.dataset.dir;
    if (active.has(dir)) { active.delete(dir); btn.classList.remove('on'); }
    else { active.add(dir); btn.classList.add('on'); }
  });
});

document.getElementById('removeBtn').addEventListener('click', () => {
  active.clear();
  document.querySelectorAll('.arrow.on').forEach(b => b.classList.remove('on'));
  document.getElementById('status').textContent = '';
  document.getElementById('legend').innerHTML = '';
  document.getElementById('results').innerHTML = '';
});

document.getElementById('solveBtn').addEventListener('click', () => {
  const status = document.getElementById('status');
  status.textContent = 'Solving…';
  document.getElementById('results').innerHTML = '';
  document.getElementById('legend').innerHTML = '';
  // let the "Solving…" message paint before the search blocks the page
  setTimeout(solve, 30);
});

function solve() {
  const status = document.getElementById('status');
  const results = document.getElementById('results');
  const legend = document.getElementById('legend');
  results.innerHTML = '';

  const target = parseInt(document.getElementById('target').value, 10);
  if (isNaN(target)) { status.textContent = 'Enter a target number.'; return; }

  const usePlus = document.getElementById('opPlus').checked;
  const useMinus = document.getElementById('opMinus').checked;
  if (!usePlus && !useMinus) { status.textContent = 'Select + and/or −.'; return; }
  if (active.size === 0) { status.textContent = 'Draw at least one arrow.'; return; }

  const lines = [];
  for (const dir of active) for (const ln of DIRS[dir]) lines.push(ln);

  // RULES: each tile gets ONE role for the whole board - addition (+1) or
  // subtraction (-1). A line is read in arrow order; the first number just
  // starts the expression, the other two add or subtract by their tile role.
  const SIGNS = usePlus && useMinus ? [1, -1] : usePlus ? [1] : [-1];

  // Quick check: if no three distinct numbers can ever make the target,
  // skip the whole search.
  let feasible = false;
  for (let a = 1; a <= 9 && !feasible; a++)
    for (let b = 1; b <= 9 && !feasible; b++)
      for (let c = 1; c <= 9 && !feasible; c++) {
        if (a === b || b === c || a === c) continue;
        for (const sb of SIGNS) for (const sc of SIGNS)
          if (a + sb * b + sc * c === target) feasible = true;
      }
  if (!feasible) { status.textContent = 'No solutions found.'; return; }

  // A tile's role only matters where it is NOT the first number of a line.
  const needsSign = new Array(9).fill(false);
  for (const ln of lines) { needsSign[ln[1]] = true; needsSign[ln[2]] = true; }

  // Fill cells in an order that completes lines as early as possible,
  // so hopeless partial arrangements get discarded sooner.
  const order = [];
  {
    const placed = new Set();
    while (order.length < 9) {
      let bestCell = -1, bestScore = -1;
      for (let c = 0; c < 9; c++) {
        if (placed.has(c)) continue;
        let score = 0;
        for (const ln of lines) {
          if (ln.indexOf(c) === -1) continue;
          let k = 0;
          for (const x of ln) if (placed.has(x)) k++;
          score += Math.pow(4, k);
        }
        if (score > bestScore) { bestScore = score; bestCell = c; }
      }
      order.push(bestCell);
      placed.add(bestCell);
    }
  }
  const depthOf = new Array(9);
  order.forEach((c, i) => { depthOf[c] = i; });

  // Lines grouped by the search depth at which their last cell is filled.
  const completesAt = Array.from({ length: 9 }, () => []);
  for (const ln of lines)
    completesAt[Math.max(depthOf[ln[0]], depthOf[ln[1]], depthOf[ln[2]])].push(ln);
  const linesLeft = new Array(10).fill(0);
  for (let d = 8; d >= 0; d--) linesLeft[d] = linesLeft[d + 1] + completesAt[d].length;

  const MAX_SHOW = 200, MAX_COUNT = 50000;
  let best = 0;            // highest number of lines hitting the target
  let sols = new Map();    // placement key -> {g: numbers, s: tile roles}
  let overflow = false;
  const grid = new Array(9);
  const sign = new Array(9).fill(1);
  const used = new Array(10).fill(false);
  let hits = 0;

  (function place(d) {
    // even if every remaining line hits, can we still reach the best?
    if (hits + linesLeft[d] < Math.max(best, 1)) return;
    if (d === 9) {
      if (hits < best) return;
      if (hits > best) { best = hits; sols = new Map(); overflow = false; }
      const key = grid.join('');
      if (!sols.has(key)) {
        if (sols.size >= MAX_COUNT) { overflow = true; return; }
        sols.set(key, { g: grid.slice(), s: sign.slice() });
      }
      return;
    }
    const cell = order[d];
    const cellSigns = needsSign[cell] ? SIGNS : [1];
    for (let n = 1; n <= 9; n++) {
      if (used[n]) continue;
      used[n] = true;
      grid[cell] = n;
      for (const sg of cellSigns) {
        sign[cell] = sg;
        let add = 0;
        for (const ln of completesAt[d]) {
          if (grid[ln[0]] + sign[ln[1]] * grid[ln[1]] + sign[ln[2]] * grid[ln[2]] === target) add++;
        }
        hits += add;
        place(d + 1);
        hits -= add;
      }
      used[n] = false;
    }
  })(0);

  const total = sols.size;
  status.textContent = best === 0
    ? 'No solutions found.'
    : 'Best: ' + best + ' of ' + lines.length + ' line' + (lines.length === 1 ? '' : 's') +
      ' hit ' + target + ' — ' + (overflow ? MAX_COUNT + '+' : total) +
      ' arrangement' + (total === 1 ? '' : 's') +
      (total > MAX_SHOW ? ' (showing first ' + MAX_SHOW + ')' : '') + '.';

  legend.innerHTML = best === 0 ? '' :
    '<span class="add">+ tiles</span>' +
    (useMinus ? '<span class="sub">&minus; tiles</span>' : '');

  const frag = document.createDocumentFragment();
  let shown = 0;
  for (const { g, s } of sols.values()) {
    if (shown++ >= MAX_SHOW) break;
    const div = document.createElement('div');
    div.className = 'sol';

    const hitLines = lines.filter(ln =>
      g[ln[0]] + s[ln[1]] * g[ln[1]] + s[ln[2]] * g[ln[2]] === target);

    // Tile colors: red = the tile adds, blue = the tile subtracts.
    // A tile that only ever starts a line counts as adding.
    const cls = new Array(9).fill('');
    for (const ln of hitLines) {
      if (!cls[ln[0]]) cls[ln[0]] = 'add';
      cls[ln[1]] = s[ln[1]] > 0 ? 'add' : 'sub';
      cls[ln[2]] = s[ln[2]] > 0 ? 'add' : 'sub';
    }

    const tbl = document.createElement('table');
    for (let r = 0; r < 3; r++) {
      const tr = document.createElement('tr');
      for (let c = 0; c < 3; c++) {
        const td = document.createElement('td');
        const idx = r * 3 + c;
        td.textContent = g[idx];
        if (cls[idx]) td.className = cls[idx];
        tr.appendChild(td);
      }
      tbl.appendChild(tr);
    }
    div.appendChild(tbl);

    // Show the expression of every line that hit the target.
    const det = document.createElement('details');
    const sum = document.createElement('summary');
    sum.textContent = 'math';
    det.appendChild(sum);
    const exprs = hitLines.map(ln =>
      g[ln[0]] + (s[ln[1]] > 0 ? '+' : '-') + g[ln[1]] +
      (s[ln[2]] > 0 ? '+' : '-') + g[ln[2]] + '=' + target);
    det.appendChild(document.createTextNode([...new Set(exprs)].join('  ')));
    div.appendChild(det);

    frag.appendChild(div);
  }
  results.appendChild(frag);
}
</script>
</body>
</html>
